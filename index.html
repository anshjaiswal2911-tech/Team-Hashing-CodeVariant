<html class="claymorphic" lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('project-graveyard-theme');
          var themes = ['dark', 'light', 'botanical-light', 'claymorphic', 'glassmorphic'];
          document.documentElement.className = themes.includes(saved) ? saved : 'claymorphic';

      })();

  <body class="bg-surface font-sans text-on-surface antialiased min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
